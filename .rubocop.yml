plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: false

Metrics/BlockLength:
  Exclude:
    - "*.gemspec"
    - spec/**/*
Metrics/ClassLength:
  Max: 350
# Aligned with the sibling lex-llm-* providers (vllm/gemini/mlx): the rubocop
# default ModuleLength is too strict for a discovery runner carrying the full
# evidence-building surface. Length is still bounded (Max 350).
Metrics/ModuleLength:
  Max: 350
Metrics/MethodLength:
  Enabled: false
RSpec/ExampleLength:
  Max: 25
RSpec/MultipleExpectations:
  Enabled: false
RSpec/SubjectStub:
  Enabled: false
